[package]
name = "magicmtn-contracts"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Frozen harness configuration and inventory contracts"

[dependencies]
anyhow = "1.0.86"
chrono = { version = "0.4.38", features = ["serde"] }
hex = "0.4.3"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.10.9"
uuid = { version = "1.10.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.40.0", features = ["macros", "rt"] }
