[package]
name = "magicmtn-local"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
publish = false
description = "Single-user local assembly of the MagicMtn engine"

[dependencies]
magicmtn-engine = { path = "../core", features = ["sqlite"] }
magicmtn-provider-framework = { path = "../sdk/rust/magicmtn-provider-framework", features = ["host"] }
anyhow = "1"
axum = "0.7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
ring = "0.17"
hex = "0.4"
tracing-subscriber = "0.3"

[dev-dependencies]
magicmtn-sdk = { path = "../sdk/rust/magicmtn-sdk" }
tower = { version = "0.5", features = ["util"] }
